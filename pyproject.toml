[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitelens-ai"
version = "0.1.0"
description = "Evidence-based website technology analysis for authorized targets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpcore>=1.0,<2",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "sqlmodel>=0.0.22,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests/backend"]

[tool.ruff]
line-length = 100
